apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlflow-trace-retention
  labels:
    app: mlflow-postgres
spec:
  # 02:17 UTC daily — off-peak, offset off the hour to avoid cluster-wide cron pileup
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app: mlflow-trace-retention
        spec:
          restartPolicy: Never
          containers:
            - name: retention
              image: registry.redhat.io/rhel9/postgresql-15:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  CUTOFF="(EXTRACT(EPOCH FROM now() - INTERVAL '${RETENTION_DAYS} days') * 1000)::bigint"

                  echo "mlflow-trace-retention: cutoff = ${RETENTION_DAYS} days, batch = ${BATCH_SIZE}"
                  psql -v ON_ERROR_STOP=1 -qtAX \
                    -c "SELECT 'candidate traces: ' || count(*) FROM trace_info WHERE timestamp_ms < ${CUTOFF};"

                  total=0
                  while true; do
                    # Deleting from trace_info is sufficient: spans, span_metrics, trace_tags,
                    # trace_request_metadata, trace_metrics and assessments all have
                    # ON DELETE CASCADE foreign keys onto it.
                    n=$(psql -v ON_ERROR_STOP=1 -qtAX -c "
                      WITH doomed AS (
                        SELECT request_id FROM trace_info
                        WHERE timestamp_ms < ${CUTOFF}
                        ORDER BY timestamp_ms
                        LIMIT ${BATCH_SIZE}
                      )
                      DELETE FROM trace_info t USING doomed d
                      WHERE t.request_id = d.request_id
                      RETURNING 1;" | grep -c '^1$' || true)

                    if [ "${n}" -eq 0 ]; then
                      break
                    fi
                    total=$(( total + n ))
                    echo "  deleted ${n} traces (running total: ${total})"
                    # Let autovacuum and WAL flushing breathe between batches
                    sleep 2
                  done

                  echo "mlflow-trace-retention: removed ${total} traces"

                  # Plain VACUUM returns the pages to the table's free space map so new
                  # spans reuse them. It does NOT shrink the files on disk — that needs
                  # VACUUM FULL or pg_repack, which take an exclusive lock and are run
                  # manually in a maintenance window.
                  psql -v ON_ERROR_STOP=1 -qtAX -c "VACUUM (ANALYZE) spans;"
                  psql -v ON_ERROR_STOP=1 -qtAX -c "VACUUM (ANALYZE) trace_info;"
                  echo "mlflow-trace-retention: done"
              env:
                - name: PGHOST
                  value: mlflow-postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: mlflow
                - name: PGDATABASE
                  value: mlflow
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
                # Traces older than this are deleted. At the observed ingest rate
                # (~170 MB/day while active) 90 days settles around 15 GB of the 50 GB volume.
                - name: RETENTION_DAYS
                  value: "90"
                # The oldest traces carry ~2,000 spans each (~1.4 KB per span), so 50
                # traces is roughly a 140 MB transaction — sized to stay well inside
                # the 1 Gi Postgres memory limit.
                - name: BATCH_SIZE
                  value: "50"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
