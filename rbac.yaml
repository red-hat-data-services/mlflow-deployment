# ServiceAccount for CI trace ingestion (rfe-autofixer, rfe-assessor, etc.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-ci-traces
---
# Role: read-only access (browse UI, view all resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-reader
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments", "registeredmodels", "datasets", "jobs"]
    verbs: ["get", "list"]
---
# Role: editor access (read + create/update, push traces)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-editor
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments", "registeredmodels", "datasets", "jobs"]
    verbs: ["get", "list", "create", "update"]
---
# Role: full admin access (editor + delete)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-admin
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments", "registeredmodels", "datasets", "jobs"]
    verbs: ["*"]
---
# Role: push traces via /v1/traces
# Two layers: OAuth proxy delegate-urls checks services/traces create,
# then kubernetes-auth checks mlflow.kubeflow.org experiments update.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-trace-pusher
rules:
  - apiGroups: [""]
    resources: ["services/traces"]
    verbs: ["create"]
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments"]
    verbs: ["update"]
---
# CI SA gets reader access (resolve experiments by name via kubernetes-auth)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-ci-reader
subjects:
  - kind: ServiceAccount
    name: mlflow-ci-traces
roleRef:
  kind: Role
  name: mlflow-reader
  apiGroup: rbac.authorization.k8s.io
---
# CI SA can push traces via /v1/traces (OAuth proxy gate)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-ci-trace-pusher
subjects:
  - kind: ServiceAccount
    name: mlflow-ci-traces
roleRef:
  kind: Role
  name: mlflow-trace-pusher
  apiGroup: rbac.authorization.k8s.io
---
# MLflow admins (can create/delete experiments, manage all resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-admin
subjects:
  - kind: User
    name: astefanu
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mlflow-admin
  apiGroup: rbac.authorization.k8s.io
---
# Read access for all authenticated users (browse experiments, view traces)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-reader-authenticated
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mlflow-reader
  apiGroup: rbac.authorization.k8s.io
