# ServiceAccount for CI trace ingestion (rfe-autofixer, rfe-assessor, etc.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-ci-traces
---
# Role: read-only access (browse UI, view traces and experiments)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-reader
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments", "registered_models"]
    verbs: ["get", "list"]
---
# Role: editor access (read + create experiments, push traces)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-editor
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments", "registered_models"]
    verbs: ["get", "list", "create", "update"]
---
# Role: full admin access (editor + delete)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-admin
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments", "registered_models"]
    verbs: ["*"]
---
# CI SA gets editor access (push traces, create experiments)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-ci-editor
subjects:
  - kind: ServiceAccount
    name: mlflow-ci-traces
roleRef:
  kind: Role
  name: mlflow-editor
  apiGroup: rbac.authorization.k8s.io
