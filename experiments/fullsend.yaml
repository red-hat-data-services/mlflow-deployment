# fullsend experiment
# Agent: https://github.com/fullsend-ai/fullsend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-experiment-fullsend
rules:
- apiGroups: ["mlflow.kubeflow.org"]
  resources: ["experiments"]
  resourceNames: ["fullsend"]
  verbs: ["get", "list", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-experiment-fullsend
subjects:
- kind: User
  name: dhshah
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mlflow-experiment-fullsend
  apiGroup: rbac.authorization.k8s.io
