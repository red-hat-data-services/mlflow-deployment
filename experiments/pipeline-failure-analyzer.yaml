---
# Scoped role: grants access to a single experiment
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-experiment-pipeline-failure-analyzer
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments"]
    resourceNames: ["pipeline-failure-analyzer"]
    verbs: ["get", "list", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-experiment-pipeline-failure-analyzer
subjects:
  - kind: User
    name: vshawrh
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mlflow-experiment-pipeline-failure-analyzer
  apiGroup: rbac.authorization.k8s.io
