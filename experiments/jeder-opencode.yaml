# MLflow experiment: jeder-opencode
# Agent: jeder-opencode (laptop-based, interactive auth via OIDC/SSO)
---
# Scoped role: grants access to a single experiment
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-experiment-jeder-opencode
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments"]
    resourceNames: ["jeder-opencode"]
    verbs: ["get", "list", "update", "delete"]
---
# Bind the experiment maintainer(s) — one subject per user.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-experiment-jeder-opencode
subjects:
  - kind: User
    name: jeder
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mlflow-experiment-jeder-opencode
  apiGroup: rbac.authorization.k8s.io
