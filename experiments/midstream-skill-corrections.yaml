# midstream-skill-corrections experiment
# Agent: RHAIIS midstream "push-trace" skill (interactive conversation traces +
#        heuristically-detected skill corrections, pushed via the MLflow tracing API)
# Source: https://github.com/neuralmagic/rhaiis-midstream-snippets (plugins/midstream/skills/push-trace)
---
# Scoped role: grants access to a single experiment, plus trace push.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-experiment-midstream-skill-corrections
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments"]
    resourceNames: ["midstream-skill-corrections"]
    verbs: ["get", "list", "update", "delete"]
  # Push traces via /v1/traces. The OAuth proxy gates trace ingestion on a
  # `services/traces create` SAR (see the mlflow-trace-pusher role); the
  # experiments rule above satisfies the second-layer `experiments update`
  # check. Without this rule, maintainers can manage the experiment but cannot
  # push traces to it interactively (oc whoami -t), which docs/usage.md says
  # they should be able to. NOTE: the same rule is missing from
  # experiments/_template.yaml — recommend adding it there too.
  - apiGroups: [""]
    resources: ["services/traces"]
    verbs: ["create"]
---
# Bind the experiment maintainer(s): Selbi Siddiqi's team.
# Subjects are the OpenShift usernames the cluster's OpenID IDP resolves to —
# the bare RH uid (e.g. `whardy`), NOT `whardy@redhat.com`. Confirmed via
# `oc get user '~'` (-> name: whardy). Using the @redhat.com form silently
# matches no one, so per-user grants never take effect.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-experiment-midstream-skill-corrections
subjects:
  - kind: User
    name: aottimo
    apiGroup: rbac.authorization.k8s.io
