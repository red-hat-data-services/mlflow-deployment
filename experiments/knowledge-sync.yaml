---
# Scoped role: grants access to a single experiment
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-experiment-knowledge-sync
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments"]
    resourceNames: ["knowledge-sync"]
    verbs: ["get", "list", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-experiment-knowledge-sync
subjects:
  - kind: User
    name: vshawrh
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mlflow-experiment-knowledge-sync
  apiGroup: rbac.authorization.k8s.io
